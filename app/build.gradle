plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'dev.overwrite.taploop'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.overwrite.taploop'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// android.jar only has stubs for org.json, so plain JVM tests can't use it.
// Compile a small copy outside the android classpath and put it first.
def jsonShim = tasks.register('compileJsonShim', JavaCompile) {
    source = fileTree('src/testShim/java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('jsonShim')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

tasks.withType(Test).configureEach {
    dependsOn jsonShim
    doFirst {
        classpath = files(jsonShim.get().destinationDirectory) + classpath
    }
}
